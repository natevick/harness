name: guardrails-test

on:
  push:
    branches: [main]
    paths:
      - 'packages/guardrails/**'
      - 'packages/*/install.sh'
      - 'install.sh'
      - '.github/workflows/guardrails-test.yml'
  pull_request:
    paths:
      - 'packages/guardrails/**'
      - 'packages/*/install.sh'
      - 'install.sh'
      - '.github/workflows/guardrails-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prefer Homebrew Bash on macOS
        if: runner.os == 'macOS'
        run: |
          # macos-latest ships /bin/bash 3.2; Homebrew has Bash 5+.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          if ! bash --version | head -1 | grep -q 'version [45]'; then
            brew install bash
          fi
          command -v bash
          bash --version | head -1

      - name: Smoke installers (-h)
        run: |
          set -euo pipefail
          ./install.sh -h
          ./packages/guardrails/install.sh -h
          ./packages/discipline/install.sh -h
          ./packages/bench/install.sh -h

      - name: Run guardrails tests
        working-directory: packages/guardrails
        run: bash tests/run.sh
